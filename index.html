<style>
  :root{
    --blue:#0A62BE;      /* logo base blue, darkened for white text */
    --cyan:#12B8E0;      /* logo top cyan */
    --ink:#10243A;
    --slate:#4E6378;
    --mist:#E8F1F8;
    --paper:#FFFFFF;
    --rule:#CFDCE8;
    --font:"Archivo", "Helvetica Neue", Arial, sans-serif;
    --max:1180px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);color:var(--ink);background:var(--paper);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  img{display:block}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 28px}
  .wide{font-stretch:125%;font-variation-settings:"wdth" 125}
  :focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

  /* header */
  .top{background:var(--paper);border-bottom:1px solid var(--rule)}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;height:76px}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none}
  .brand img{width:34px;height:auto}
  .brand b{font-weight:800;font-size:1.15rem;letter-spacing:-.01em;font-stretch:125%;font-variation-settings:"wdth" 125}
  .top nav{display:flex;align-items:center;gap:30px}
  .top nav a{text-decoration:none;font-size:.95rem;color:var(--slate)}
  .top nav a:hover{color:var(--ink)}
  .top nav a.btn-sm{color:var(--paper);background:var(--ink);padding:10px 18px;border-radius:4px}
  .top nav a.btn-sm:hover{background:var(--blue);color:var(--paper)}

  /* hero */
  .hero{background:var(--blue);color:var(--paper);position:relative;overflow:hidden}
  .hero .wrap{position:relative;z-index:1;padding-top:120px;padding-bottom:128px}
  .hero h1{font-weight:800;font-size:clamp(2.6rem,6.6vw,5.6rem);line-height:.98;letter-spacing:-.025em;max-width:10em;font-stretch:125%;font-variation-settings:"wdth" 125}
  .hero p{max-width:34em;margin-top:32px;font-size:1.2rem;color:#DCEBFA}
  .hero .actions{display:flex;flex-wrap:wrap;align-items:center;gap:28px;margin-top:44px}
  .btn{display:inline-block;background:var(--paper);color:var(--blue);font-weight:700;text-decoration:none;padding:16px 26px;border-radius:4px}
  .btn:hover{background:var(--mist)}
  .hero .textlink{color:var(--paper);font-weight:600;text-underline-offset:5px;text-decoration-thickness:2px}
  .shield{position:absolute;right:-140px;top:50%;transform:translateY(-50%);width:640px;height:auto;z-index:0;pointer-events:none}
  .shield path{fill:none;stroke-linejoin:round}
  .shield .outer{stroke:var(--cyan);stroke-width:3;opacity:.9}
  .shield .inner{stroke:#fff;stroke-width:1.5;opacity:.28}
  .shield path{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.2s cubic-bezier(.6,0,.2,1) .2s forwards}
  .shield .inner{animation-delay:.6s}
  @keyframes draw{to{stroke-dashoffset:0}}

  /* sections */
  section{padding:112px 0}
  h2{font-weight:800;font-size:clamp(1.9rem,3.6vw,2.8rem);line-height:1.05;letter-spacing:-.02em;font-stretch:125%;font-variation-settings:"wdth" 125}
  .lead{color:var(--slate);max-width:32em;margin-top:18px}

  /* services */
  .services .grid{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:72px}
  .services .side{position:sticky;top:40px;align-self:start}
  .svc-group + .svc-group{margin-top:56px}
  .svc-group h3{font-size:1rem;font-weight:700;color:var(--blue);margin-bottom:8px}
  .svc{display:grid;grid-template-columns:1fr 1.25fr;gap:32px;padding:22px 0;border-top:1px solid var(--rule)}
  .svc dt{font-weight:700;font-size:1.2rem;line-height:1.3}
  .svc dd{color:var(--slate)}

  /* ventures */
  .v-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:56px}
  .venture{border-radius:6px;padding:40px;display:flex;flex-direction:column;gap:18px;min-height:360px}
  .venture img{width:76px;height:76px;border-radius:18px;object-fit:contain}
  .venture h3{font-weight:800;font-size:1.6rem;line-height:1.1;letter-spacing:-.01em;font-stretch:125%;font-variation-settings:"wdth" 125}
  .venture p{max-width:30em}
  .venture .foot{margin-top:auto;padding-top:12px}
  .sn{background:#161233;color:#ECEBFF}
  .sn p{color:#C4C1E8}
  .sn .btn{background:#3FE6F0;color:#0A0820}
  .sn .btn:hover{background:#8DF2F7}
  .sn .foot{display:flex;flex-wrap:wrap;gap:14px}
  .btn-line{display:inline-block;padding:14.5px 24.5px;border:1.5px solid #8A85C9;border-radius:4px;color:#ECEBFF;font-weight:700;text-decoration:none}
  .btn-line:hover{border-color:#3FE6F0;color:#3FE6F0}
  .sd{background:var(--paper);border:1.5px solid var(--rule)}
  .sd img{background:#fff;border:1.5px solid var(--rule);padding:10px}
  .sd p{color:var(--slate)}
  .sd .foot{font-size:.93rem;color:var(--slate)}

  /* contact */
  .contact{background:var(--ink);color:var(--paper)}
  .contact .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:end}
  .contact p{color:#B8C9DA;margin-top:18px;max-width:30em}
  .mail{font-weight:800;font-size:clamp(1.4rem,3vw,2.3rem);letter-spacing:-.01em;color:var(--paper);text-decoration:none;border-bottom:3px solid var(--cyan);padding-bottom:6px;word-break:break-all;font-stretch:112%;font-variation-settings:"wdth" 112}
  .mail:hover{color:var(--cyan)}
  .contact small{display:block;margin-top:18px;color:#B8C9DA;font-size:.95rem}

  footer{background:var(--ink);color:#8FA4B8;font-size:.88rem;border-top:1px solid #23394F}
  footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:28px;padding-bottom:32px}

  @media (max-width:960px){
    .services .grid{grid-template-columns:1fr;gap:40px}
    .services .side{position:static}
    .v-grid,.contact .wrap{grid-template-columns:1fr}
    .shield{width:420px;right:-190px;opacity:.35}
  }
  @media (max-width:640px){
    .top nav a:not(.btn-sm){display:none}
    .hero .wrap{padding-top:72px;padding-bottom:80px}
    section{padding:76px 0}
    .svc{grid-template-columns:1fr;gap:6px}
    .venture{padding:28px;min-height:0}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .shield path{animation:none;stroke-dashoffset:0}
  }
</style>
